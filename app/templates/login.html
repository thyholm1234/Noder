{% from "_icons.html" import icon %}
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    {% include "_pwa_head.html" %}
    <title>Log ind - Noder</title>
    <link rel="stylesheet" href="{{ asset('style.css') }}">
    <script>try { var t = localStorage.getItem('noder.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body class="login-body">
    <div class="login-staff" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-mark">{{ icon('music', 28) }}</div>
                <h1>Noder</h1>
                <p>Noder og stemmer til dit kor</p>
            </div>
            {% if error %}
            <div class="login-error" role="alert">{{ icon('alert', 16) }} {{ error }}</div>
            {% endif %}
            <form method="post" action="/login" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
                <div class="form-group">
                    <label for="username">Brugernavn</label>
                    <input type="text" id="username" name="username" required
                           value="{{ username }}" {% if not username %}autofocus{% endif %}
                           autocomplete="username" autocapitalize="none" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="password">Adgangskode</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" required
                               {% if username %}autofocus{% endif %} autocomplete="current-password">
                        <button type="button" class="password-reveal" data-reveal="#password" aria-label="Vis adgangskode">{{ icon('eye', 16) }}</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Log ind</button>
            </form>
        </div>
    </div>
    <script src="{{ asset('app.js') }}"></script>
</body>
</html>
